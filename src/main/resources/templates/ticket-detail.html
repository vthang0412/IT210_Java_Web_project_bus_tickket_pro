<!doctype html>
<div th:replace="layout :: layout(~{::content})" th:with="pageTitle='Chi tiết vé'">
  <div class="card mx-auto" style="max-width:800px;">
    <div class="card-body">
      <h5 class="card-title">Chi tiết vé</h5>
      <div th:if="${ticket != null}">
        <p><strong>Mã vé:</strong> <span th:text="${ticket.ticketCode}"></span></p>
        <p><strong>Họ tên:</strong> <span th:text="${ticket.customerName}"></span></p>
        <p><strong>SĐT:</strong> <span th:text="${ticket.customerPhone}"></span></p>
        <p><strong>Ghế:</strong> <span th:text="${ticket.seat.seatNumber}"></span></p>
        <p><strong>Trạng thái:</strong> <span th:text="${ticket.status}"></span></p>
      </div>
      <div th:if="${ticket == null}">Không tìm thấy vé.</div>
    </div>
  </div>
</div>
