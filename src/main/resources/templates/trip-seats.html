<?xml version="1.0" encoding="UTF-8"?>
<!-- Updated trip-seats template: submit holds to /trip/{id}/hold -->
<!doctype html>
<div th:replace="layout :: layout(~{::content})" th:with="pageTitle='Chọn ghế'">
  <div class="card mx-auto" style="max-width:900px;">
    <div class="card-body">
      <h5 class="card-title">Sơ đồ ghế - Chuyến: <span th:text="${trip.id}"></span></h5>
      <div class="mb-3">
        <div>Chú thích: <span class="badge bg-success">Trống</span> <span class="badge bg-warning text-dark">Đang giữ</span> <span class="badge bg-danger">Đã đặt</span></div>
      </div>
      <form th:action="@{/trip/{id}/hold(id=${trip.id})}" method="post">
        <div class="d-flex flex-wrap">
          <div th:each="seat: ${seats}" class="m-1">
            <label th:classappend="${seat.status.name() == 'AVAILABLE'} ? 'seat-available' : (seat.status.name()=='PENDING' ? 'seat-pending' : 'seat-booked')" class="d-inline-block p-2 rounded">
              <input type="radio" name="seatId" th:value="${seat.id}" th:disabled="${seat.status != T(com.example.busticket.model.SeatStatus).AVAILABLE}" />
              <span th:text="${seat.seatNumber}"></span>
            </label>
          </div>
        </div>
        <div class="mt-3">
          <div class="mb-2">
            <label class="form-label">Họ tên</label>
            <input name="customerName" class="form-control" required />
          </div>
          <div class="mb-2">
            <label class="form-label">SĐT</label>
            <input name="customerPhone" class="form-control" required pattern="\d{9,12}" />
          </div>
          <button class="btn btn-primary">Giữ chỗ & Tiếp tục</button>
        </div>
      </form>
    </div>
  </div>
</div>
